<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details - AniStream</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #08090d;
  --surface: #10121a;
  --surface-card: #131520;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #f8f9fd;
  --muted: #9ba1b6;
  --accent: #ff2a6d;
  --accent-gradient: linear-gradient(135deg, #ff2a6d 0%, #ff6b8b 100%);
  --radius-sm: 6px;
  --radius-md: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; outline: none; }

header {
  background: rgba(17, 17, 24, 0.95);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.logo b { color: var(--accent); }
.nav a {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-left: 12px;
}
.nav a:hover { color: #fff; }

.container {
  max-width: 1100px;
  margin: auto;
  padding: 14px 10px 60px;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 800;
  margin-bottom: 10px;
}

/* COMPACT HERO */
.hero {
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  background: #14141c;
  border: 1px solid var(--line);
  margin-bottom: 14px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.22;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, #0b0b0f 8%, rgba(11,11,15,0.7) 60%, transparent);
}
.hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding: 16px 14px;
}
.poster {
  width: 95px;
  height: 140px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: #222;
  border: 1px solid var(--line-strong);
  flex-shrink: 0;
}
.info { flex: 1; min-width: 0; }
.info h1 {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 6px;
  color: #fff;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.tag {
  background: rgba(255, 42, 109, 0.15);
  border: 1px solid rgba(255, 42, 109, 0.3);
  color: #ff759f;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9.5px;
  font-weight: 700;
}
.meta {
  color: var(--muted);
  font-size: 11px;
  margin: 3px 0 6px;
}
.description {
  color: #c7cbd7;
  line-height: 1.45;
  font-size: 11.5px;
  max-height: 58px;
  overflow-y: auto;
}

/* COMPACT SHARE BOX */
.share-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.share-title {
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 8px;
}
.share-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.share-btn {
  border: none;
  cursor: pointer;
  color: #fff;
  padding: 6px 11px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.share-main { background: var(--accent); }
.copy-btn { background: #262938; }
.whatsapp-btn { background: #128c7e; }
.telegram-btn { background: #229ed9; }
.share-message {
  color: #6dff91;
  font-size: 11px;
  margin-top: 6px;
  display: none;
}

/* COMPACT SECTIONS */
.section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  margin-bottom: 14px;
}
.section h2 {
  color: var(--accent);
  font-size: 14.5px;
  font-weight: 800;
  margin-bottom: 10px;
}

/* COMPACT EPISODES (DESKTOP-LIKE GRID) */
.episodes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
  gap: 6px;
}
.episode-btn {
  background: #141622;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
.episode-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}
.episode-btn .ep-num {
  font-size: 11px;
  font-weight: 800;
  color: #fff;
}
.episode-btn .ep-tag {
  font-size: 8.5px;
  color: #ff85a6;
  margin-top: 2px;
}
.episode-btn:hover .ep-tag { color: #fff; }

/* COMPACT COMMENTS */
.comment-form {
  background: #0e1017;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-bottom: 12px;
}
.comment-input, .comment-textarea {
  width: 100%;
  padding: 7px 10px;
  background: #141724;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: #fff;
  font-size: 12px;
}
.comment-textarea {
  min-height: 55px;
  resize: vertical;
  margin-top: 6px;
  line-height: 1.35;
}
.comment-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 14px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 6px;
}
.comment-card {
  background: #0e1017;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  margin-bottom: 6px;
}
.comment-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}
.comment-author {
  font-weight: 800;
  color: var(--accent);
  font-size: 11.5px;
}
.comment-date {
  color: #6b7280;
  font-size: 9.5px;
}
.comment-body {
  color: #d1d5db;
  font-size: 11.5px;
  line-height: 1.4;
  white-space: pre-wrap;
}

.loading, .error, .empty {
  text-align: center;
  color: #888;
  padding: 16px 8px;
  font-size: 11.5px;
}
.error { color: #ff6b81; }

@media(max-width: 480px) {
  .hero-content { padding: 12px 10px; gap: 10px; }
  .poster { width: 80px; height: 118px; }
  .info h1 { font-size: 16px; }
  .share-buttons { display: grid; grid-template-columns: repeat(2, 1fr); }
  .episodes { grid-template-columns: repeat(4, 1fr); gap: 5px; }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">🔥 Ani<b>Stream</b></a>
    <div>
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>
</header>

<div class="container">
  <a href="index.html" class="back">‹ Back to Home</a>

  <!-- ANIME DETAILS HERO -->
  <div id="animeContainer">
    <div class="loading">Anime details load ho rahe hain...</div>
  </div>

  <!-- SHARE BOX -->
  <div class="share-box">
    <div class="share-title">📤 Share Anime</div>
    <div class="share-buttons">
      <button class="share-btn share-main" onclick="shareAnime()">📤 Share</button>
      <button class="share-btn copy-btn" onclick="copyAnimeLink()">📋 Copy Link</button>
      <a id="whatsappShare" class="share-btn whatsapp-btn" href="#" target="_blank" rel="noopener noreferrer">🟢 WhatsApp</a>
      <a id="telegramShare" class="share-btn telegram-btn" href="#" target="_blank" rel="noopener noreferrer">✈️ Telegram</a>
    </div>
    <div id="shareMessage" class="share-message">Link copied successfully!</div>
  </div>

  <!-- EPISODES SECTION -->
  <div class="section">
    <h2>📺 Select Episode</h2>
    <div id="episodeContainer" class="episodes">
      <div class="loading">Episodes load ho rahe hain...</div>
    </div>
  </div>

  <!-- COMMENTS SECTION -->
  <div class="section">
    <h2>💬 Comments</h2>
    <div class="comment-form">
      <input type="text" id="commentUserName" class="comment-input" placeholder="Aapka Name" maxlength="30">
      <textarea id="commentTextInput" class="comment-textarea" placeholder="Apna comment likhein..." maxlength="500"></textarea>
      <button type="button" class="comment-btn" onclick="postComment()">Post Comment</button>
      <div id="commentPostMessage" style="font-size:11px; margin-top:5px;"></div>
    </div>
    <div id="commentsContainer">
      <div class="loading">Comments load ho rahe hain...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://gmacsiymybvfcxydvkla.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const params = new URLSearchParams(window.location.search);
const animeId = params.get("id");

const animeContainer = document.getElementById("animeContainer");
const episodeContainer = document.getElementById("episodeContainer");
const commentsContainer = document.getElementById("commentsContainer");
const shareMessage = document.getElementById("shareMessage");
const whatsappShare = document.getElementById("whatsappShare");
const telegramShare = document.getElementById("telegramShare");

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getAnimeShareLink(){
  return window.location.href;
}

function updateShareLinks(){
  const shareUrl = getAnimeShareLink();
  const shareText = "Watch " + (document.title || "Anime") + " on AniStream";
  whatsappShare.href = "https://wa.me/?text=" + encodeURIComponent(shareText + "\n\n" + shareUrl);
  telegramShare.href = "https://t.me/share/url?url=" + encodeURIComponent(shareUrl) + "&text=" + encodeURIComponent(shareText);
}

async function shareAnime(){
  const shareUrl = getAnimeShareLink();
  const shareTitle = document.title || "AniStream";
  const shareText = "Watch this anime on AniStream";
  if(navigator.share){
    try{
      await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
    }catch(error){}
  }else{
    copyAnimeLink();
  }
}

async function copyAnimeLink(){
  const shareUrl = getAnimeShareLink();
  try{
    await navigator.clipboard.writeText(shareUrl);
    showShareMessage("✅ Link copied!");
  }catch{
    const textArea = document.createElement("textarea");
    textArea.value = shareUrl;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand("copy");
    textArea.remove();
    showShareMessage("✅ Link copied!");
  }
}

function showShareMessage(message){
  shareMessage.innerText = message;
  shareMessage.style.display = "block";
  setTimeout(() => { shareMessage.style.display = "none"; }, 2000);
}

async function loadAnime(){
  if(!animeId){
    animeContainer.innerHTML = '<div class="error">❌ Anime ID nahi mila.</div>';
    episodeContainer.innerHTML = '<div class="empty">Anime select karo.</div>';
    commentsContainer.innerHTML = '<div class="empty">Comments unavailable.</div>';
    return;
  }

  const { data, error } = await supabaseClient
    .from("anime")
    .select("*")
    .eq("anime_id", animeId)
    .maybeSingle();

  if(error){
    animeContainer.innerHTML = '<div class="error">❌ Load failed: ' + escapeHtml(error.message) + '</div>';
    return;
  }

  if(!data){
    animeContainer.innerHTML = '<div class="error">❌ Anime nahi mila.</div>';
    return;
  }

  renderAnime(data);
  loadEpisodes(data.anime_id);
  loadComments(data.anime_id);
}

function renderAnime(anime){
  const genres = anime.genre ? anime.genre.split(",").map(g => g.trim()).filter(Boolean) : [];
  let tags = "";
  genres.forEach(genre => { tags += `<span class="tag">${escapeHtml(genre)}</span>`; });
  if(anime.language) tags += `<span class="tag">${escapeHtml(anime.language)}</span>`;
  if(anime.status) tags += `<span class="tag">${escapeHtml(anime.status)}</span>`;

  document.title = (anime.title || "Anime") + " - AniStream";

  animeContainer.innerHTML = `
    <div class="hero">
      ${anime.banner_url ? `<img class="hero-bg" src="${escapeHtml(anime.banner_url)}" alt="">` : ""}
      <div class="hero-overlay"></div>
      <div class="hero-content">
        ${anime.thumbnail_url ? `<img class="poster" src="${escapeHtml(anime.thumbnail_url)}" alt="${escapeHtml(anime.title)}" onerror="this.style.display='none'">` : ""}
        <div class="info">
          <h1>${escapeHtml(anime.title)}</h1>
          <div class="tags">${tags}</div>
          ${anime.season ? `<div class="meta">Format: ${escapeHtml(anime.season)}</div>` : ""}
          <div class="description">${escapeHtml(anime.description || "Description available nahi hai.")}</div>
        </div>
      </div>
    </div>
  `;
  updateShareLinks();
}

async function loadEpisodes(targetAnimeId){
  episodeContainer.innerHTML = '<div class="loading">Loading episodes...</div>';

  const { data, error } = await supabaseClient
    .from("episodes")
    .select("*")
    .eq("anime_id", targetAnimeId)
    .order("episode_number", { ascending: true });

  if(error || !data || data.length === 0){
    episodeContainer.innerHTML = '<div class="empty">Abhi koi episode available nahi hai.</div>';
    return;
  }

  episodeContainer.innerHTML = "";
  data.forEach(episode => {
    const a = document.createElement("a");
    a.className = "episode-btn";
    a.href = `watch.html?id=${encodeURIComponent(targetAnimeId)}&episode=${encodeURIComponent(episode.episode_number)}`;
    a.innerHTML = `
      <span class="ep-num">Ep ${escapeHtml(String(episode.episode_number))}</span>
      <span class="ep-tag">▶ Play</span>
    `;
    episodeContainer.appendChild(a);
  });
}

async function loadComments(targetAnimeId){
  commentsContainer.innerHTML = '<div class="loading">Loading comments...</div>';

  const { data, error } = await supabaseClient
    .from("anime_comments")
    .select("*")
    .eq("anime_id", targetAnimeId)
    .order("created_at", { ascending: false });

  if(error || !data || data.length === 0){
    commentsContainer.innerHTML = '<div class="empty">Abhi koi comment nahi hai. Pehle comment aap karein!</div>';
    return;
  }

  commentsContainer.innerHTML = "";
  data.forEach(c => {
    const card = document.createElement("div");
    card.className = "comment-card";
    const dateFormatted = new Date(c.created_at).toLocaleDateString("en-IN", {
      day: "numeric", month: "short"
    });

    card.innerHTML = `
      <div class="comment-header">
        <span class="comment-author">👤 ${escapeHtml(c.user_name)}</span>
        <span class="comment-date">${escapeHtml(dateFormatted)}</span>
      </div>
      <p class="comment-body">${escapeHtml(c.comment_text)}</p>
    `;
    commentsContainer.appendChild(card);
  });
}

async function postComment(){
  const nameInput = document.getElementById("commentUserName");
  const textInput = document.getElementById("commentTextInput");
  const msg = document.getElementById("commentPostMessage");

  const userName = nameInput.value.trim();
  const commentText = textInput.value.trim();

  if(!userName || !commentText){
    msg.style.color = "#ff6b81";
    msg.textContent = "❌ Name aur comment dono zaroori hain.";
    return;
  }

  msg.style.color = "#aaa";
  msg.textContent = "Posting...";

  const { error } = await supabaseClient.from("anime_comments").insert([{
    anime_id: animeId,
    user_name: userName,
    comment_text: commentText
  }]);

  if(error){
    msg.style.color = "#ff6b81";
    msg.textContent = "❌ Failed: " + error.message;
    return;
  }

  msg.style.color = "#6dff91";
  msg.textContent = "✅ Comment posted!";
  textInput.value = "";
  loadComments(animeId);
  setTimeout(() => { msg.textContent = ""; }, 2500);
}

loadAnime();
</script>

</body>
</html>
