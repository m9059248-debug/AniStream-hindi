<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Schedule</title>
<style>
:root{
  --bg:#090d18;--panel:#111a2b;--panel2:#172238;--line:#263651;
  --text:#f4f7ff;--mute:#9baac2;--accent:#6d7cff;--accent2:#23c9d6;
  --ok:#43d6b5;--red:#ff536b;
}
*{box-sizing:border-box;margin:0}
body{
  background:radial-gradient(ellipse at 50% -15%,#202b50 0%,#0b1120 48%,var(--bg) 100%);
  color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;
  padding:18px 14px 36px;max-width:960px;margin:auto;min-height:100vh
}
header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:12px;margin:10px 0 20px;padding:16px;
  background:linear-gradient(135deg,rgba(24,36,62,.96),rgba(16,25,43,.96));
  border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.22)
}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.back-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 13px;border-radius:10px;text-decoration:none;
  color:#fff;background:#202e4b;border:1px solid #35496d;
  font-size:14px;font-weight:600;white-space:nowrap;transition:.2s
}
.back-btn:hover{background:#2b3d63;transform:translateY(-1px)}
h1{font-size:clamp(18px,4vw,24px);font-weight:750;letter-spacing:.2px}
#clock{font-size:21px;font-variant-numeric:tabular-nums;color:var(--accent2);font-weight:700;text-align:right}
#clock small{display:block;font-size:11px;color:var(--mute);font-weight:500;text-align:right;margin-top:2px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 12px;margin-bottom:12px;scrollbar-width:thin}
#tabs button{
  flex:none;background:var(--panel);color:var(--mute);border:1px solid var(--line);
  border-radius:10px;padding:10px 16px;font-size:13px;font-weight:650;cursor:pointer;transition:.2s
}
#tabs button:hover{border-color:#6275db;color:var(--text)}
#tabs button.active{background:linear-gradient(135deg,var(--accent),#5965d8);color:#fff;border-color:transparent;box-shadow:0 5px 16px rgba(109,124,255,.25)}
#tabs button.today::after{content:" •";color:var(--accent2)}
.item{
  display:flex;gap:14px;background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.14);transition:border-color .2s,transform .2s
}
.item:hover{border-color:#465c8b;transform:translateY(-1px)}
.item.done{border-color:var(--red)}
.thumb{
  width:100px;height:132px;border-radius:10px;object-fit:cover;flex:none;
  background:#202d45;border:1px solid #30415f
}
.info{flex:1;min-width:0;padding:2px 0}
.info h2{font-size:17px;font-weight:700;margin-bottom:5px;line-height:1.35}
.meta{font-size:12px;color:var(--mute);margin-bottom:10px}
.timer{
  display:inline-block;font-size:17px;font-weight:750;font-variant-numeric:tabular-nums;
  color:var(--ok);padding:6px 10px;border:1px solid rgba(67,214,181,.45);
  background:rgba(67,214,181,.08);border-radius:8px
}
.item.done .timer{color:#fff;background:var(--red);border-color:var(--red)}
.more{margin-top:10px;background:none;border:none;color:#aebaff;font-size:13px;font-weight:600;cursor:pointer;padding:0;text-decoration:none}
.more:hover{color:#fff}
.details{display:none;margin-top:8px;font-size:13px;line-height:1.65;color:var(--mute);padding:10px;background:rgba(5,10,20,.28);border-radius:8px}
.details.open{display:block}
.empty{color:var(--mute);padding:34px 16px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:14px}
@media(max-width:520px){
  body{padding:10px 10px 28px}
  header{padding:12px;gap:10px}
  .header-left{gap:9px}
  .back-btn{padding:8px 10px;font-size:13px}
  #clock{font-size:18px}
  .thumb{width:82px;height:112px}
  .item{gap:11px;padding:10px}
  .info h2{font-size:15px}
  .timer{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a class="back-btn" href="/" aria-label="Back to Home"><span aria-hidden="true">←</span> Home</a>
    <h1>Anime Release Schedule</h1>
  </div>
  <div id="clock"></div>
</header>
<div id="tabs"></div>
<div id="list"></div>

<script>
/* ============================================================
   YAHAN APNE ANIME ADD KARO (sirf yehi part edit karna hai)
   day:  0=Sunday 1=Monday 2=Tuesday 3=Wednesday 4=Thursday 5=Friday 6=Saturday
   time: 24 ghante format me, India time (IST). Jaise 8:30 PM = "20:30"
   thumb: image ka link (khali chhodo to simple box dikhega)
   ============================================================ */
const ANIME = [
  { name:"Anime Name 1", ep:5,  day:1, time:"18:00", thumb:"", genre:"Action, Fantasy", lang:"Hindi, Tamil, Telugu",
    about:"Yahan anime ki story ya details likho." },
  { name:"Anime Name 2", ep:12, day:1, time:"21:30", thumb:"", genre:"Romance, Comedy", lang:"Hindi",
    about:"Yahan anime ki story ya details likho." },
  { name:"Anime Name 3", ep:3,  day:3, time:"20:00", thumb:"", genre:"Adventure", lang:"Hindi, English",
    about:"Yahan anime ki story ya details likho." },
  { name:"Anime Name 4", ep:8,  day:6, time:"19:00", thumb:"", genre:"Sci-Fi", lang:"Hindi",
    about:"Yahan anime ki story ya details likho." }
];
/* ============== Yahan se neeche kuch change mat karo ============== */

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const IST = 5.5*3600*1000;
const pad = n => String(n).padStart(2,"0");
const istNow = () => new Date(Date.now()+IST);          // IST ko UTC fields se padhte hain

function targetOf(a){
  const n = istNow(), [h,m] = a.time.split(":").map(Number);
  let t = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + (a.day - n.getUTCDay()), h, m);
  if (n.getTime() - t > 24*3600*1000) t += 7*24*3600*1000;   // 24 ghante baad agle hafte ka timer
  return t;
}
function fmt12(t){ const [h,m]=t.split(":").map(Number); return (h%12||12)+":"+pad(m)+" "+(h<12?"AM":"PM"); }

let selected = istNow().getUTCDay();

function buildTabs(){
  const today = istNow().getUTCDay();
  document.getElementById("tabs").innerHTML = DAYS.map((d,i)=>
    `<button data-d="${i}" class="${i===selected?"active":""} ${i===today?"today":""}">${d.slice(0,3)}</button>`).join("");
}
function buildList(){
  const items = ANIME.filter(a=>a.day===selected).sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById("list").innerHTML = items.length ? items.map((a,i)=>`
    <div class="item" data-i="${ANIME.indexOf(a)}">
      <img class="thumb" src="${a.thumb}" alt="${a.name}" onerror="this.removeAttribute('src')">
      <div class="info">
        <h2>${a.name}</h2>
        <div class="meta">Episode ${a.ep} &nbsp;|&nbsp; ${DAYS[a.day]}, ${fmt12(a.time)} IST</div>
        <span class="timer">--:--:--</span><br>
        <button class="more">Details dekho</button>
        <div class="details"><b>Genre:</b> ${a.genre}<br><b>Language:</b> ${a.lang}<br>${a.about}</div>
      </div>
    </div>`).join("") : `<div class="empty">Is din koi anime nahi aa raha.</div>`;
}
function tick(){
  const n = istNow();
  document.getElementById("clock").innerHTML =
    `${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}<small>${DAYS[n.getUTCDay()]} • India Time</small>`;
  document.querySelectorAll(".item").forEach(el=>{
    const a = ANIME[el.dataset.i], diff = targetOf(a) - n.getTime(), t = el.querySelector(".timer");
    if (diff <= 0){ el.classList.add("done"); t.textContent = "Episode aa gaya!"; }
    else{
      el.classList.remove("done");
      const s = Math.floor(diff/1000), d = Math.floor(s/86400);
      t.textContent = (d?d+"d ":"") + pad(Math.floor(s%86400/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
    }
  });
}
document.getElementById("tabs").onclick = e=>{
  if(e.target.dataset.d===undefined) return;
  selected = +e.target.dataset.d; buildTabs(); buildList(); tick();
};
document.getElementById("list").onclick = e=>{
  if(e.target.classList.contains("more")) e.target.nextElementSibling.classList.toggle("open");
};
buildTabs(); buildList(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
