
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Episode - Zanix Anime</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/movi-player/dist/element.js"></script>

  <style>
    :root {
      --bg: #09090f;
      --panel: #141420;
      --border: #292936;
      --purple: #9b5cff;
      --button: #8239f3;
      --text: #f5f5fa;
      --muted: #aaaabd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px 18px;
      background: #11111b;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header a {
      color: var(--purple);
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
    }

    main {
      width: min(100% - 24px, 1000px);
      margin: 22px auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    h1 { font-size: 23px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin-top: 0; }

    .muted { color: var(--muted); font-size: 14px; }

    #playerBox {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, movi-player {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #status {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    select, button, .action {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #1d1d2b;
      color: white;
      font-size: 14px;
    }

    button, .action {
      cursor: pointer;
      background: var(--button);
      border: none;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .secondary { background: #29293a; }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 9px;
    }

    .episode-btn.active { background: #9b5cff; }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ffb4b4;
      font-size: 13px;
      margin-top: 12px;
    }

    @media (max-width: 480px) {
      main { width: calc(100% - 16px); margin-top: 14px; }
      .panel { padding: 12px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
<header>
  <a href="index.html">Zanix Anime</a>
</header>

<main>
  <section class="panel">
    <h1 id="episodeTitle">Loading episode...</h1>
    <div class="muted" id="episodeInfo">Please wait</div>
  </section>

  <section class="panel">
    <div id="playerBox">
      <div id="status">Loading video...</div>
    </div>

    <div id="message"></div>

    <div class="controls">
      <div>
        <label for="qualitySelect">Video quality</label>
        <select id="qualitySelect">
          <option value="480p">480p</option>
          <option value="720p" selected>720p</option>
          <option value="1080p">1080p</option>
        </select>
      </div>

      <div>
        <label for="audioSelect">Audio language / track</label>
        <select id="audioSelect">
          <option value="Hindi">Hindi</option>
          <option value="Japanese">Japanese</option>
          <option value="English">English</option>
          <option value="Tamil">Tamil</option>
          <option value="Telugu">Telugu</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="playBtn" type="button">▶ Play</button>
      <a id="downloadBtn" class="action secondary"
         href="#" target="_blank" rel="noopener">Download</a>
    </div>
  </section>

  <section class="panel">
    <h2>Episodes</h2>
    <div id="episodeList" class="episode-grid">
      <div class="muted">Loading episodes...</div>
    </div>
  </section>

  <section class="panel">
    <div class="actions">
      <button id="prevBtn" class="secondary" type="button">← Previous</button>
      <button id="nextBtn" class="secondary" type="button">Next →</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // Supabase project settings
  const SUPABASE_URL = "https://gmacsiymybvfcxydvkla.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(location.search);
  const animeId = params.get("anime_id");
  let animeName = params.get("anime_name") || "Anime";
  let episodeNumber = Number(params.get("episode") || 1);

  let episodes = [];
  let currentEpisode = null;
  let availableLinks = [];
  let currentUrl = "";

  const $ = id => document.getElementById(id);

  function showMessage(text) {
    $("message").textContent = text || "";
  }

  function normalizeQuality(value) {
    return String(value || "").toLowerCase().replace(/\s/g, "");
  }

  function getQuality(row) {
    return row.quality || row.video_quality || row.resolution || "";
  }

  function getLanguage(row) {
    return row.language || row.audio_language || row.lang || "";
  }

  function getStreamUrl(row) {
    return row.stream_url || row.video_url || row.url || "";
  }

  function getDownloadUrl(row) {
    return row.download_url || row.stream_url || row.video_url || row.url || "";
  }

  function setTitle() {
    const name = currentEpisode?.anime_name || animeName;
    const number = currentEpisode?.episode_number || episodeNumber;

    $("episodeTitle").textContent = `${name} — Episode ${String(number).padStart(2, "0")}`;
    $("episodeInfo").textContent = `Episode ${number}`;
    document.title = `Episode ${number} - ${name} | Zanix Anime`;
  }

  function stopPlayer() {
    const box = $("playerBox");
    box.innerHTML = '<div id="status">Preparing video...</div>';
  }

  function playVideo(url) {
    showMessage("");

    if (!url) {
      showMessage("Is quality ke liye stream URL available nahi hai.");
      return;
    }

    currentUrl = url;
    stopPlayer();

    const box = $("playerBox");

    // MKV may not be supported by browsers. Try the configured player first.
    const player = document.createElement("movi-player");
    player.setAttribute("controls", "");
    player.setAttribute("playsinline", "");
    player.setAttribute("crossorigin", "anonymous");
    player.setAttribute("src", url);

    player.addEventListener("error", () => {
      showMessage(
        "Video play nahi hua. Server CORS/Range requests block kar sakta hai, " +
        "ya MKV/codec browser ke saath compatible nahi hai. Download button alag se kaam kar sakta hai."
      );
    });

    player.addEventListener("errordisplay", () => {
      showMessage(
        "Player video decode nahi kar pa raha. MP4 (H.264 video + AAC audio) " +
        "ya browser-compatible stream URL use karke dekho."
      );
    });

    box.replaceChildren(player);

    $("downloadBtn").href = getSelectedDownloadUrl() || url;
  }

  function getSelectedDownloadUrl() {
    const quality = normalizeQuality($("qualitySelect").value);
    const language = $("audioSelect").value.toLowerCase();

    const match = availableLinks.find(row =>
      normalizeQuality(getQuality(row)) === quality &&
      (!getLanguage(row) || getLanguage(row).toLowerCase() === language)
    );

    if (match) return getDownloadUrl(match);

    const anyQuality = availableLinks.find(row =>
      normalizeQuality(getQuality(row)) === quality
    );

    return anyQuality ? getDownloadUrl(anyQuality) : currentEpisode?.download_url || currentUrl;
  }

  function chooseLink() {
    const quality = normalizeQuality($("qualitySelect").value);
    const language = $("audioSelect").value.toLowerCase();

    let match = availableLinks.find(row =>
      normalizeQuality(getQuality(row)) === quality &&
      getLanguage(row).toLowerCase() === language
    );

    if (!match) {
      match = availableLinks.find(row =>
        normalizeQuality(getQuality(row)) === quality &&
        !getLanguage(row)
      );
    }

    if (!match) {
      match = availableLinks.find(row =>
        normalizeQuality(getQuality(row)) === quality
      );
    }

    if (match) {
      $("downloadBtn").href = getDownloadUrl(match) || "#";
      playVideo(getStreamUrl(match) || getDownloadUrl(match));
      return;
    }

    // Fallback for a URL stored directly in the episodes table.
    const fallback = currentEpisode?.stream_url || currentEpisode?.video_url || "";

    if (fallback) {
      $("downloadBtn").href =
        currentEpisode?.download_url || fallback;
      playVideo(fallback);
    } else {
      $("playerBox").innerHTML =
        '<div id="status">Is quality ka video link nahi mila.</div>';
      showMessage("Admin panel mein is episode ke liye quality aur stream URL add karo.");
      $("downloadBtn").href = "#";
    }
  }

  async function loadLinks() {
    availableLinks = [];

    if (!currentEpisode) return;

    // Link table may use episode_id, episode_number or anime_id.
    if (currentEpisode.id != null) {
      const result = await db
        .from("episode_links")
        .select("*")
        .eq("episode_id", currentEpisode.id);

      if (!result.error && result.data) {
        availableLinks = result.data;
      }
    }

    if (!availableLinks.length && animeId) {
      const result = await db
        .from("episode_links")
        .select("*")
        .eq("anime_id", animeId)
        .eq("episode_number", episodeNumber);

      if (!result.error && result.data) {
        availableLinks = result.data;
      }
    }

    // If link rows exist but have no matching quality, keep the list and
    // let chooseLink display the helpful missing-link message.
  }

  function renderEpisodes() {
    const list = $("episodeList");
    list.innerHTML = "";

    if (!episodes.length) {
      list.textContent = "No episodes found.";
      return;
    }

    episodes.forEach(row => {
      const number = Number(row.episode_number);
      const button = document.createElement("button");

      button.type = "button";
      button.className = "episode-btn" +
        (number === episodeNumber ? " active" : "");
      button.textContent = `EP ${number}`;
      button.addEventListener("click", () => {
        const url = new URL(location.href);
        url.searchParams.set("episode", number);
        if (animeId) url.searchParams.set("anime_id", animeId);
        if (animeName) url.searchParams.set("anime_name", animeName);
        location.href = url.toString();
      });

      list.appendChild(button);
    });
  }

  async function loadEpisodes() {
    let query = db.from("episodes").select("*");

    if (animeId) {
      query = query.eq("anime_id", animeId);
    } else {
      query = query.eq("anime_name", animeName);
    }

    const result = await query.order("episode_number", { ascending: true });

    if (result.error) {
      $("episodeList").textContent =
        "Episodes load nahi hue. Supabase table columns aur SELECT policy check karo.";
      showMessage(result.error.message);
      return;
    }

    episodes = result.data || [];

    // If anime_name wasn't provided in the URL, infer it from the first row.
    if (episodes.length && !params.get("anime_name")) {
      animeName = episodes[0].anime_name || animeName;
    }

    currentEpisode = episodes.find(row =>
      Number(row.episode_number) === episodeNumber
    );

    if (!currentEpisode && episodes.length) {
      currentEpisode = episodes[0];
      episodeNumber = Number(currentEpisode.episode_number) || 1;
    }

    renderEpisodes();
    setTitle();

    $("prevBtn").disabled = !episodes.some(
      row => Number(row.episode_number) < episodeNumber
    );
    $("nextBtn").disabled = !episodes.some(
      row => Number(row.episode_number) > episodeNumber
    );

    if (!currentEpisode) {
      $("playerBox").innerHTML =
        '<div id="status">Episode not found.</div>';
      showMessage("URL mein anime_id / anime_name aur episode number check karo.");
      return;
    }

    await loadLinks();
    chooseLink();
  }

  $("qualitySelect").addEventListener("change", chooseLink);

  $("audioSelect").addEventListener("change", () => {
    // This selects a matching URL only if the admin stored separate language
    // links. It cannot create extra audio tracks inside a single video file.
    chooseLink();
  });

  $("playBtn").addEventListener("click", () => {
    if (currentUrl) playVideo(currentUrl);
    else chooseLink();
  });

  $("downloadBtn").addEventListener("click", event => {
    if (!getSelectedDownloadUrl() || getSelectedDownloadUrl() === "#") {
      event.preventDefault();
      showMessage("Download URL available nahi hai.");
    }
  });

  $("prevBtn").addEventListener("click", () => {
    const previous = episodes
      .filter(row => Number(row.episode_number) < episodeNumber)
      .sort((a, b) => Number(b.episode_number) - Number(a.episode_number))[0];

    if (previous) {
      const url = new URL(location.href);
      url.searchParams.set("episode", previous.episode_number);
      location.href = url.toString();
    }
  });

  $("nextBtn").addEventListener("click", () => {
    const next = episodes
      .filter(row => Number(row.episode_number) > episodeNumber)
      .sort((a, b) => Number(a.episode_number) - Number(b.episode_number))[0];

    if (next) {
      const url = new URL(location.href);
      url.searchParams.set("episode", next.episode_number);
      location.href = url.toString();
    }
  });

  loadEpisodes().catch(error => {
    $("playerBox").innerHTML =
      '<div id="status">Something went wrong.</div>';
    showMessage(error.message || String(error));
  });
})();
</script>
</body>
</html>
