<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090f"><title>Watch Episode - AnimeHindiZone</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--panel:#11111b;--line:#292936;--text:#f5f5fa;--muted:#a7a7b8;--red:#e63946}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:#11111bf2;border-bottom:1px solid var(--line)}
.head{max-width:1120px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{color:#ff5360;font-weight:800;font-size:21px;text-decoration:none}.home{color:white;text-decoration:none;background:#242432;border:1px solid var(--line);padding:9px 13px;border-radius:9px}
main{max-width:1120px;margin:auto;padding:18px 14px 40px}h1{font-size:clamp(20px,4vw,30px);margin:0 0 6px}.sub{color:var(--muted);font-size:14px}
.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.player{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
#playerHost{width:100%;height:100%;background:#000}#playerHost movi-player{display:block;width:100%;height:100%;--movi-accent:var(--red)}
#message{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;color:#ccc;line-height:1.5;pointer-events:none}
#message strong{display:block;color:white;margin-bottom:8px}
.actions,.quality,.audio{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:12px;border-top:1px solid var(--line)}
button,.link,select{font:inherit;border-radius:9px;padding:10px 13px}
button,.link{border:1px solid #39394a;cursor:pointer;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--red);border-color:var(--red);color:white}.secondary,.q{background:#242432;color:white}
button:disabled{opacity:.45;cursor:not-allowed}.q.active{background:var(--red);border-color:var(--red)}
.label,.audio label{color:var(--muted);font-size:14px}select{background:#20202e;color:white;border:1px solid #414153;min-width:175px;max-width:100%}
.hint{padding:0 12px 13px;color:var(--muted);font-size:12px;line-height:1.5}
.section{margin-top:18px;padding:15px}.section h2{margin:0 0 13px;font-size:18px}
#episodeNav{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:9px}
#episodeNav a{min-height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;background:#222230;border:1px solid #39394a;border-radius:9px;padding:9px 7px;font-size:14px;font-weight:700}
#episodeNav a.current,#episodeNav a:hover{background:var(--red);border-color:var(--red)}
.status{padding:12px;color:var(--muted);font-size:14px}.error{color:#ff9ca3}footer{text-align:center;color:#777789;padding:25px;font-size:12px}
@media(max-width:520px){.head{padding:12px}.brand{font-size:18px}main{padding:14px 10px 30px}.actions>*{flex:1}.section{padding:13px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/movi-player/dist/element.js"></script>
</head>
<body>
<header><div class="head"><a class="brand" href="index.html">AnimeHindiZone</a><a class="home" href="index.html">← Home</a></div></header>
<main>
<h1 id="episodeTitle">Loading episode…</h1><p class="sub" id="animeTitle">Please wait</p>
<section class="card">
 <div class="player"><div id="playerHost"></div><div id="message"><strong>Loading video…</strong><span>Opening the episode player.</span></div></div>
 <div class="actions"><button id="streamBtn" class="primary" disabled>▶ Stream</button><a id="downloadBtn" class="link secondary" href="#" target="_blank" rel="noopener" aria-disabled="true">↓ Download</a></div>
 <div class="quality" id="qualityRow"><span class="label">Quality:</span><span class="sub">Loading…</span></div>
 <div class="audio"><label for="audioLanguage">Audio language</label><select id="audioLanguage" disabled><option>Waiting for audio tracks…</option></select></div>
 <div class="hint" id="hint">Available audio tracks will appear here when the file has multiple tracks.</div>
</section>
<section class="section"><h2>Episodes</h2><div id="episodeNav"><div class="status">Loading episodes…</div></div></section>
<div id="status" class="status"></div>
</main><footer>AnimeHindiZone</footer>
<script>
(async function(){
 const SUPABASE_URL="https://gmacsiymybvfcxydvkla.supabase.co";
 const SUPABASE_KEY="sb_publishable_Li6BRvLN87cvF8zghHQCxw_STmBDeGF";
 const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const params=new URLSearchParams(location.search), animeId=params.get("id"), episodeNo=Number(params.get("episode")||1);
 const $=id=>document.getElementById(id);
 let player=null, animeTitle="Anime";
 function message(title,detail,show=true){const box=$("message");box.innerHTML="";const b=document.createElement("strong");b.textContent=title;box.appendChild(b);const s=document.createElement("span");s.textContent=detail||"";box.appendChild(s);box.style.display=show?"flex":"none"}
 function download(url){const a=$("downloadBtn");if(url){a.href=url;a.style.opacity="1";a.style.pointerEvents="auto";a.setAttribute("aria-disabled","false")}else{a.href="#";a.style.opacity=".45";a.style.pointerEvents="none";a.setAttribute("aria-disabled","true")}}
 function cleanup(){if(player){try{player.pause()}catch(e){}player.remove();player=null}$("playerHost").innerHTML="";$("audioLanguage").innerHTML='<option value="">Waiting for audio tracks…</option>';$("audioLanguage").disabled=true}
 function languageName(t,i){const x=((t.lang||t.language||"")+" "+(t.label||t.title||"")).toLowerCase();if(/\b(hi|hin|hindi)\b/.test(x))return"Hindi";if(/\b(ja|jpn|japanese)\b/.test(x))return"Japanese";if(/\b(en|eng|english)\b/.test(x))return"English";if(/\b(ta|tam|tamil)\b/.test(x))return"Tamil";if(/\b(te|tel|telugu)\b/.test(x))return"Telugu";return t.label||t.title||t.lang||("Audio track "+(i+1))}
 async function audioOptions(el){
   const sel=$("audioLanguage");sel.innerHTML="";
   try{
    const tracks=typeof el.getAudioLangs==="function"?el.getAudioLangs():[];
    if(!tracks||!tracks.length){sel.innerHTML='<option value="">No audio tracks detected</option>';sel.disabled=true;$("hint").textContent="No tracks were detected, or the video host blocks browser access.";return}
    tracks.forEach((t,i)=>{const o=document.createElement("option");o.value=t.lang||t.language||t.label||t.title||String(i);o.textContent=languageName(t,i);if(t.active)o.selected=true;sel.appendChild(o)});
    sel.disabled=tracks.length<2;
    sel.onchange=async()=>{try{if(typeof el.selectAudioLang==="function"){await el.selectAudioLang(sel.value);$("hint").textContent="Audio track changed."}}catch(e){console.error(e);$("hint").textContent="Could not switch this audio track."}};
    $("hint").textContent=tracks.length>1?"Choose a language to switch audio.":"Only one audio track is available in this file.";
   }catch(e){console.error(e);sel.innerHTML='<option value="">Audio selector unavailable</option>';sel.disabled=true}
 }
 async function playUrl(url){
   cleanup();if(!url){message("No video link found","Add a Stream URL in the admin panel.");return}
   message("Loading video…","The MKV player is opening this file.");
   try{
    await customElements.whenDefined("movi-player");
    const el=document.createElement("movi-player");el.setAttribute("controls","");el.setAttribute("playsinline","");el.setAttribute("src",url);el.style.width="100%";el.style.height="100%";
    el.addEventListener("loadeddata",()=>{if(player!==el)return;message("","",false);audioOptions(el)});
    el.addEventListener("trackschange",()=>{if(player===el)audioOptions(el)});
    el.addEventListener("errordisplay",e=>{console.error("Player error",e.detail);message("Video could not play","The host may block CORS/range requests, or the codec may not be supported.")});
    el.addEventListener("error",()=>message("Video failed to load","Check that the link is active and allows browser playback."));
    player=el;$("playerHost").appendChild(el);$("message").style.display="none";
   }catch(e){console.error(e);message("Player could not start","Refresh and try again.")}
 }
 function showQualities(rows,fallback){
  const box=$("qualityRow");box.innerHTML='<span class="label">Quality:</span>';
  const order={"1080p":0,"720p":1,"480p":2};
  rows.sort((a,b)=>(order[a.quality]??9)-(order[b.quality]??9));
  if(!rows.length){box.insertAdjacentHTML("beforeend",'<span class="sub">Default</span>');$("streamBtn").disabled=!fallback;$("streamBtn").onclick=()=>fallback&&window.open(fallback,"_blank","noopener");download("");if(fallback)playUrl(fallback);return}
  rows.forEach((row,i)=>{const b=document.createElement("button");b.className="q"+(i===0?" active":"");b.textContent=row.quality||"Quality";b.onclick=()=>{box.querySelectorAll(".q").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("streamBtn").disabled=!row.stream_url;$("streamBtn").onclick=()=>row.stream_url&&window.open(row.stream_url,"_blank","noopener");download(row.download_url);playUrl(row.stream_url||row.download_url)};box.appendChild(b)});
  const first=rows[0];$("streamBtn").disabled=!first.stream_url;$("streamBtn").onclick=()=>first.stream_url&&window.open(first.stream_url,"_blank","noopener");download(first.download_url);playUrl(first.stream_url||first.download_url);
 }
 async function loadEpisodes(){
  const nav=$("episodeNav");const {data,error}=await db.from("episodes").select("episode_number,episode_title").eq("anime_id",animeId).order("episode_number",{ascending:true});
  nav.innerHTML="";if(error||!data){nav.innerHTML='<div class="status error">Could not load episodes.</div>';console.error(error);return}
  if(!data.length){nav.innerHTML='<div class="status">No episodes added yet.</div>';return}
  data.forEach(ep=>{const a=document.createElement("a");a.href="watch.html?id="+encodeURIComponent(animeId)+"&episode="+encodeURIComponent(ep.episode_number);a.textContent="EP "+ep.episode_number;a.title=ep.episode_title||("Episode "+ep.episode_number);if(Number(ep.episode_number)===episodeNo){a.className="current";a.setAttribute("aria-current","page")}nav.appendChild(a)})
 }
 try{
  $("streamBtn").disabled=true;download("");
  if(!animeId){message("Episode ID missing","Open an episode from the anime page.");$("status").textContent="URL needs ?id=ANIME_ID&episode=NUMBER.";return}
  const {data:anime,error:ae}=await db.from("anime").select("anime_id,title").eq("anime_id",animeId).maybeSingle();if(ae)console.warn(ae);
  animeTitle=anime?.title||"Anime";$("animeTitle").textContent=animeTitle+" • Episode "+episodeNo;$("episodeTitle").textContent=animeTitle+" — Episode "+episodeNo;
  const {data:ep,error:ee}=await db.from("episodes").select("video_url,episode_title").eq("anime_id",animeId).eq("episode_number",episodeNo).maybeSingle();if(ee)console.warn(ee);
  if(ep?.episode_title)$("episodeTitle").textContent=animeTitle+" — "+ep.episode_title;
  const {data:links,error:le}=await db.from("episode_links").select("quality,stream_url,download_url").eq("anime_name",animeTitle).eq("episode_number",episodeNo);if(le)console.warn(le);
  showQualities((links||[]).filter(x=>x.stream_url||x.download_url),ep?.video_url||"");await loadEpisodes();
 }catch(e){console.error(e);message("Could not load episode","Refresh the page and check the Supabase setup.");$("status").textContent="An error occurred while loading this episode."}
})();
</script>
</body></html>
